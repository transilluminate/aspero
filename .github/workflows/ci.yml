name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Navigability: no source file over 1,000 lines unless allow-listed,
      # and no path or DESIGN section cited in the docs or comments that
      # isn't there (agents find their way by them).
      - run: |
          scripts/file-sizes.py
          scripts/event-names.py
          scripts/doc-paths.py
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Provider tests replay recorded fixtures: no network or API keys needed.
      - run: cargo test --workspace --all-features
      # The Swift API: bindings generated as the release's are the committed
      # snapshot, contracts/aspero_ffi.swift (on macOS, where the release
      # generates them).
      - if: matrix.os == 'macos-latest'
        run: scripts/swift-bindings.sh
      # Doc links resolve, as docs.rs builds them (default features).
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The engine builds without its default providers (as a library user
      # picking its own), and with one of them alone.
      - run: cargo check -p aspero-engine --no-default-features
      - run: cargo check -p aspero-engine --no-default-features --features crossref

  # The declared MSRV (`rust-version`) builds: a dependency bump that needs
  # a newer rustc fails here, not in a user's build.
  msrv:
    name: msrv (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  # Advisories (RustSec), banned or wildcard dependencies, and unknown
  # sources, per deny.toml; each ignored advisory says why there.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --workspace check advisories bans sources
