name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Navigability: no source file over 1,000 lines unless allow-listed,
      # and no path or DESIGN section cited in the docs or comments that
      # isn't there (agents find their way by them).
      - run: |
          scripts/file-sizes.py
          scripts/doc-paths.py
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Provider tests replay recorded fixtures: no network or API keys needed.
      - run: cargo test --workspace --all-features
      # The engine builds without its default providers (as a library user
      # picking its own), and with one of them alone.
      - run: cargo check -p aspero-engine --no-default-features
      - run: cargo check -p aspero-engine --no-default-features --features crossref
