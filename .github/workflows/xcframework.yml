# Attaches the macOS app framework (AsperoFFI.xcframework.zip) and its
# Swift bindings to each release, once dist's Release workflow has made it,
# with the tag's pinned contracts (contracts/, DESIGN "Seams and
# contracts"): tools.json, stored-v1.jsonl and diagnostics-v2.jsonl.
name: xcframework

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach to (e.g. v0.4.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    # Releases come from tag pushes; Release also runs (planning only) on PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/xcframework.sh
      # The bindings attached are the tag's committed snapshot, byte for
      # byte (embedders pin its sha256; CI checks the two agree).
      - run: |
          if [ -f contracts/aspero_ffi.swift ]; then
            cmp target/xcframework/aspero_ffi.swift contracts/aspero_ffi.swift
          fi
      - run: |
          assets=(target/xcframework/AsperoFFI.xcframework.zip target/xcframework/aspero_ffi.swift)
          # Older tags have no contracts/.
          for f in tools.json stored-v1.jsonl diagnostics-v2.jsonl; do
            if [ -f "contracts/$f" ]; then assets+=("contracts/$f"); fi
          done
          gh release upload "$TAG" --clobber "${assets[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
