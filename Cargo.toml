[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/bib",
    "crates/store",
    "crates/engine",
    "crates/json",
    "crates/ffi",
    "crates/cli",
    "crates/providers/*",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/transilluminate/aspero"
homepage = "https://github.com/transilluminate/aspero"
authors = ["Adrian Robinson"]

[workspace.dependencies]
aspero-core = { path = "crates/core", version = "0.6.2" }
aspero-bib = { path = "crates/bib", version = "0.6.2" }
aspero-store = { path = "crates/store", version = "0.6.2" }
aspero-engine = { path = "crates/engine", version = "0.6.2" }
aspero-json = { path = "crates/json", version = "0.6.2" }
aspero-openalex = { path = "crates/providers/openalex", version = "0.6.2" }
aspero-crossref = { path = "crates/providers/crossref", version = "0.6.2" }
aspero-datacite = { path = "crates/providers/datacite", version = "0.6.2" }
aspero-doi = { path = "crates/providers/doi", version = "0.6.2" }
aspero-europepmc = { path = "crates/providers/europepmc", version = "0.6.2" }
aspero-openlibrary = { path = "crates/providers/openlibrary", version = "0.6.2" }

async-trait = "0.1.92"
biblatex = "0.12.0"
quick-xml = "0.38.4"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hayagriva = { version = "0.10.1", default-features = false, features = ["csl-json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
directories = "6.0.0"
fastrand = "2.5.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
jiff = { version = "0.2.42", features = ["serde"] }
percent-encoding = "2.3.2"
proptest = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
unicode-normalization = "0.1.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
