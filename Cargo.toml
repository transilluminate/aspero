[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/bib",
    "crates/store",
    "crates/engine",
    "crates/json",
    "crates/ffi",
    "crates/mcp",
    "crates/cli",
    "crates/notices-gen",
    "crates/providers/*",
]

[workspace.package]
version = "0.43.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/transilluminate/aspero"
authors = ["Adrian Robinson"]

[workspace.dependencies]
aspero-core = { path = "crates/core", version = "0.43.0" }
aspero-bib = { path = "crates/bib", version = "0.43.0" }
aspero-store = { path = "crates/store", version = "0.43.0" }
aspero-engine = { path = "crates/engine", version = "0.43.0" }
aspero-json = { path = "crates/json", version = "0.43.0" }
aspero-mcp = { path = "crates/mcp", version = "0.43.0" }
aspero-openalex = { path = "crates/providers/openalex", version = "0.43.0" }
aspero-crossref = { path = "crates/providers/crossref", version = "0.43.0" }
aspero-datacite = { path = "crates/providers/datacite", version = "0.43.0" }
aspero-doi = { path = "crates/providers/doi", version = "0.43.0" }
aspero-europepmc = { path = "crates/providers/europepmc", version = "0.43.0" }
aspero-openlibrary = { path = "crates/providers/openlibrary", version = "0.43.0" }
aspero-pmc = { path = "crates/providers/pmc", version = "0.43.0" }

async-trait = "0.1.92"
biblatex = "0.12.0"
quick-xml = "0.38.4"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
hayagriva = { version = "0.10.1", default-features = false, features = ["csl-json"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
comfy-table = "8.0.1"
directories = "6.0.0"
fastrand = "2.5.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
jiff = { version = "0.2.42", features = ["serde"] }
percent-encoding = "2.3.2"
proptest = "1.12.0"
# The official MCP SDK, pinned exactly: it moves fast (3.0 to 3.10 in
# four months).
rmcp = { version = "=3.8.0", default-features = false }
# Only one crate per build may link sqlite3 (`links = "sqlite3"`), so a
# workspace that depends on aspero's crates must use the same rusqlite
# major (libsqlite3-sys 0.39): bump them together.
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
schemars = "1.2.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
unicode-normalization = "0.1.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are off, and why:
# `#[must_use]` on every getter and builder is noise; the types where
# ignoring the result is a bug carry it by hand.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Error and panic cases are in the prose where they matter, not in a
# boilerplate section on every fallible function.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pairs like `doi`/`dois` and `left`/`right` are the clearest names.
similar_names = "allow"
# Names that repeat their module (`id::IdError`) read better where used.
module_name_repetitions = "allow"
# Option and flag structs (CLI arguments, query settings) are bool-heavy
# by nature.
struct_excessive_bools = "allow"
# `assert!(x.is_empty())` reads plainer than comparing with a typed empty
# array, the only rewrite the lint offers.
assert_is_empty = "allow"
# Score and price arithmetic on counts, which never approach 2^52.
cast_precision_loss = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
