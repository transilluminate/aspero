[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/engine",
    "crates/cli",
    "crates/providers/*",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aspero-core = { path = "crates/core" }
aspero-store = { path = "crates/store" }
aspero-engine = { path = "crates/engine" }
aspero-openalex = { path = "crates/providers/openalex" }
aspero-crossref = { path = "crates/providers/crossref" }
aspero-datacite = { path = "crates/providers/datacite" }
aspero-doi = { path = "crates/providers/doi" }

async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
fastrand = "2.5.0"
jiff = { version = "0.2.42", features = ["serde"] }
percent-encoding = "2.3.2"
proptest = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
unicode-normalization = "0.1.26"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
