# Proper nouns that clippy's `doc_markdown` would otherwise want in
# backticks; ".." keeps clippy's own list.
doc-valid-idents = [
    "OpenAlex",
    "DataCite",
    "PubMed",
    "UniFFI",
    "PDFKit",
    "StatPearls",
    "LeCun",
    "AlphaFold",
    "CorpusId",
    "JaLC",
    "SplitMix64",
    "ScienceDirect",
    "EndNote",
    "NeurIPS",
    "..",
]

# Functions over this many lines fail `too_many_lines`; the few that are one
# table or one pipeline carry a local allow saying why.
too-many-lines-threshold = 200
