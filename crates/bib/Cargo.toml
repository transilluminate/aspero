[package]
name = "aspero-bib"
description = "BibTeX/BibLaTeX reading for aspero"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aspero-core.workspace = true
biblatex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hayagriva = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[features]
# Citation styles (APA, Vancouver, …) via hayagriva.
styles = ["dep:hayagriva"]
# Zotero and Mendeley citations in Word documents.
docx = ["dep:quick-xml", "dep:serde", "dep:zip"]

[dev-dependencies]
zip = { workspace = true }
