[package]
name = "aspero"
description = "Find, resolve and verify scholarly literature from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["citations", "doi", "bibliography", "scholarly", "cli"]
categories = ["command-line-utilities", "science"]

# The workspace lints, but `unsafe_code` denied rather than forbidden: one
# libc call restores the default SIGPIPE behaviour (see `main.rs`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
aspero-bib = { workspace = true, features = ["docx", "styles"] }
aspero-core.workspace = true
aspero-engine.workspace = true
aspero-json.workspace = true
aspero-mcp.workspace = true
clap.workspace = true
comfy-table.workspace = true
directories.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true

# Released as binaries by dist (and published to crates.io).
[package.metadata.dist]
dist = true
