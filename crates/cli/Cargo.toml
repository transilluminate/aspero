[package]
name = "aspero"
description = "Find, resolve and verify scholarly literature from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["citations", "doi", "bibliography", "scholarly", "cli"]
categories = ["command-line-utilities", "science"]

[lints]
workspace = true

[dependencies]
aspero-bib.workspace = true
aspero-core.workspace = true
aspero-engine.workspace = true
clap.workspace = true
comfy-table.workspace = true
directories.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["registry"] }

# Released as binaries by dist (and published to crates.io).
[package.metadata.dist]
dist = true
