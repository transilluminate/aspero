[package]
name = "aspero"
description = "Find, resolve and verify scholarly literature from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["citations", "doi", "bibliography", "scholarly", "cli"]
categories = ["command-line-utilities", "science"]

# The workspace lints, but `unsafe_code` denied rather than forbidden: one
# libc call restores the default SIGPIPE behaviour (see `main.rs`).
[lints.rust]
unsafe_code = "deny"

# The workspace's clippy table, copied (a crate inherits all its lints or
# none): keep the two in step.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are off, and why:
# `#[must_use]` on every getter and builder is noise; the types where
# ignoring the result is a bug carry it by hand.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Error and panic cases are in the prose where they matter, not in a
# boilerplate section on every fallible function.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The long functions are match tables or linear pipelines; splitting them
# hides the flow.
too_many_lines = "allow"
# Pairs like `doi`/`dois` and `left`/`right` are the clearest names.
similar_names = "allow"
# Names that repeat their module (`id::IdError`) read better where used.
module_name_repetitions = "allow"
# Option and flag structs (CLI arguments, query settings) are bool-heavy
# by nature.
struct_excessive_bools = "allow"
# Score and price arithmetic on counts, which never approach 2^52.
cast_precision_loss = "allow"

[dependencies]
aspero-bib = { workspace = true, features = ["docx", "styles"] }
aspero-core.workspace = true
aspero-engine.workspace = true
aspero-json.workspace = true
aspero-mcp.workspace = true
clap.workspace = true
comfy-table.workspace = true
directories.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber = { workspace = true, features = ["registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
aspero-core = { workspace = true, features = ["testing"] }
aspero-openalex.workspace = true
async-trait.workspace = true
tempfile.workspace = true

# Released as binaries by dist (and published to crates.io).
[package.metadata.dist]
dist = true
