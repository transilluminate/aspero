[package]
name = "aspero-engine"
description = "Routing, caching and resilience engine for aspero"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aspero-core.workspace = true
aspero-store.workspace = true
aspero-openalex = { workspace = true, optional = true }
aspero-crossref = { workspace = true, optional = true }
aspero-datacite = { workspace = true, optional = true }
aspero-doi = { workspace = true, optional = true }
aspero-europepmc = { workspace = true, optional = true }
aspero-openlibrary = { workspace = true, optional = true }
async-trait.workspace = true
fastrand.workspace = true
jiff.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
secrecy.workspace = true
futures.workspace = true
tracing.workspace = true

[features]
default = ["openalex", "crossref", "datacite", "doi", "europepmc", "openlibrary"]
openalex = ["dep:aspero-openalex"]
crossref = ["dep:aspero-crossref"]
datacite = ["dep:aspero-datacite"]
doi = ["dep:aspero-doi"]
europepmc = ["dep:aspero-europepmc"]
openlibrary = ["dep:aspero-openlibrary"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
