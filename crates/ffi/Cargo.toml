[package]
name = "aspero-ffi"
description = "aspero for apps: Swift (and Kotlin, Python) bindings via UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Shipped as an .xcframework, not a crate.
publish = false

# Not the workspace lints: UniFFI's generated glue is `unsafe` by nature
# (C ABI); this crate's own code has none but the unified log's calls
# (`src/system_log/oslog.rs`, over `oslog.c`). The clippy table is the
# workspace's, copied (a crate inherits all its lints or none): keep the
# two in step.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are off, and why:
# `#[must_use]` on every getter and builder is noise; the types where
# ignoring the result is a bug carry it by hand.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Error and panic cases are in the prose where they matter, not in a
# boilerplate section on every fallible function.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pairs like `doi`/`dois` and `left`/`right` are the clearest names.
similar_names = "allow"
# Names that repeat their module (`id::IdError`) read better where used.
module_name_repetitions = "allow"
# Option and flag structs (CLI arguments, query settings) are bool-heavy
# by nature.
struct_excessive_bools = "allow"
# `assert!(x.is_empty())` reads plainer than comparing with a typed empty
# array, the only rewrite the lint offers.
assert_is_empty = "allow"
# Score and price arithmetic on counts, which never approach 2^52.
cast_precision_loss = "allow"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The bindings generator: `cargo run -p aspero-ffi --features bindgen --bin uniffi-bindgen`.
bindgen = ["uniffi/cli"]
# An MCP server over Streamable HTTP on loopback, with the app's own tools
# (`McpServer`, `McpHost`): the xcframework build enables it.
mcp = ["dep:aspero-mcp", "dep:async-trait"]

[dependencies]
aspero-bib = { workspace = true, features = ["docx", "styles"] }
aspero-core.workspace = true
aspero-engine.workspace = true
aspero-json.workspace = true
aspero-mcp = { workspace = true, features = ["http"], optional = true }
async-trait = { workspace = true, optional = true }
futures.workspace = true
jiff.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
tracing.workspace = true
uniffi = "0.32.2"

[build-dependencies]
# The unified log's shim (`src/system_log/oslog.c`), on Apple targets.
cc = "1.11.1"

[dev-dependencies]
async-trait.workspace = true
reqwest = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
zip = { workspace = true }

[[test]]
name = "mcp"
required-features = ["mcp"]

# Not a dist app: the xcframework workflow ships it.
[package.metadata.dist]
dist = false
