[package]
name = "aspero-mcp"
description = "aspero as a Model Context Protocol server: search, look up, verify and identify scholarly works from an agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["mcp", "citations", "doi", "bibliography", "scholarly"]
categories = ["science"]

[lints]
workspace = true

[dependencies]
aspero-core.workspace = true
aspero-engine.workspace = true
aspero-json = { workspace = true, features = ["schemars"] }
futures.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "sync"] }
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
jiff.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
