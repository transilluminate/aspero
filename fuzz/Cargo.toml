[package]
name = "aspero-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace, not a member of aspero's: `cargo test --workspace`,
# CI and `cargo publish --workspace` never see it. Needs nightly.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
aspero-bib = { path = "../crates/bib", features = ["docx"] }
aspero-core = { path = "../crates/core" }
aspero-engine = { path = "../crates/engine" }
aspero-json = { path = "../crates/json" }
aspero-mcp = { path = "../crates/mcp" }
futures = { version = "0.3", default-features = false, features = ["executor"] }
jiff = "0.2"
libfuzzer-sys = "0.4"
serde_json = "1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
debug = 1

[[bin]]
name = "webpage"
path = "fuzz_targets/webpage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "id_parse"
path = "fuzz_targets/id_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bib_read"
path = "fuzz_targets/bib_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx"
path = "fuzz_targets/docx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "references"
path = "fuzz_targets/references.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claim"
path = "fuzz_targets/claim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_args"
path = "fuzz_targets/mcp_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "titled"
path = "fuzz_targets/titled.rs"
test = false
doc = false
bench = false
